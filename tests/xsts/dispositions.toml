# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("import-namespace-mismatch").
[[dispositions]]
id = "xsts-import-namespace-mismatch"
title = "An import namespace that disagrees with the imported schema's target namespace is accepted"
category = "implementation-gap"
profiles = ["xsd10", "xsd11"]
cases = ["MS-Schema2006-07-15/schF6/schF6"]
links = ["https://www.w3.org/TR/xmlschema-1/#src-import"]
rationale = "schF6_a.xsd imports namespace ns-c from schF6_c.xsd, whose targetNamespace is ns-a; schF6_b.xsd imports the same document as ns-a. XSD 1.0 Structures 4.2.6 clause 3.1 requires the import namespace to be identical to the resolved schema document's target namespace when the schemaLocation resolves. pyxsd composes the document and accepts the schema, so the expected-invalid case is a false accept. The direct-import audit checks component references, not the namespace identity of an import target; this is a separate import-resolution check."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("no-namespace-type-reference").
[[dispositions]]
id = "xsts-no-namespace-type-reference"
title = "Unprefixed type references in a no-namespace schema resolve to same-named types in another namespace"
category = "implementation-gap"
profiles = ["xsd10", "xsd11"]
cases = [
  "MS-Schema2006-07-15/schF2/schF2.v",
  "MS-Schema2006-07-15/schG2/schG2.v",
]
links = [
  "https://www.w3.org/TR/xmlschema-1/#src-resolve",
  "https://www.w3.org/TR/xmlschema-1/#cElement_Declarations",
]
rationale = "schF2.v and schG2.v each bind a no-target-namespace document whose type=ct-A reference must resolve to the no-namespace ct-A declaration. pyxsd's merged lookup instead selects the same-local-name ct-A from ns-a or ns-b, so the valid instances are rejected against the wrong type (a1/a2 order and datatypes). The Task 4 import audit rejects an unimported namespace but does not make same-local-name lookups namespace-correct when the reference itself has no namespace."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("duplicate-global-element").
[[dispositions]]
id = "xsts-duplicate-global-element"
title = "Duplicate global element declarations from two imported documents are accepted"
category = "implementation-gap"
profiles = ["xsd10", "xsd11"]
cases = [
  "MS-Schema2006-07-15/schG6/schG6",
  "MS-Schema2006-07-15/schG11/schG11",
]
links = [
  "https://www.w3.org/TR/xmlschema-1/#Schemas",
  "https://www.w3.org/Bugs/Public/show_bug.cgi?id=4133",
]
rationale = "schG6 imports two documents that both declare e1 and ct-A in ns-b; schG11 reaches two documents that both declare foo in ns-a through an import cycle. XSD 1.0 Structures 3.15.6 clause 2 forbids two components with the same name and target namespace. pyxsd composes both documents and skips duplicate-name checks for composed components, so it accepts. The corpus marks these queried under bug 4133 because schemaLocation is a hint and an implementation may not load the second document; pyxsd does load it, so the queried status explains why another implementation may differ, not why this composed schema is valid."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("duplicate-global-attribute-group").
[[dispositions]]
id = "xsts-duplicate-global-attribute-group"
title = "Duplicate global attributeGroup declarations from two imported documents are accepted"
category = "implementation-gap"
profiles = ["xsd10", "xsd11"]
cases = ["MS-AttributeGroup2006-07-15/attgB013/attgB013"]
links = [
  "https://www.w3.org/TR/xmlschema-1/#Schemas",
  "https://www.w3.org/TR/xmlschema-1/#cAttribute_Group_Definitions",
]
rationale = "attgB013 imports two documents that both declare attributeGroup car in http://importedXSD. XSD 1.0 Structures 3.15.6 clause 2 applies to the attribute-group symbol space as well. pyxsd's composed-document duplicate-name exemption lets the second declaration coexist; unlike schG6 and schG11 this case carries no queried annotation."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("redefine-attribute-group-restriction").
[[dispositions]]
id = "xsts-redefine-attribute-group-restriction"
title = "A redefined attribute group is not checked as a valid restriction of the original"
category = "implementation-gap"
profiles = ["xsd10", "xsd11"]
cases = ["MS-AttributeGroup2006-07-15/attgC028/attgC028"]
links = ["https://www.w3.org/TR/xmlschema-1/#src-redefine"]
rationale = "attgC028 redefines attributeGroup foo (attributes att, att1, att2) with a reference to car (foo1, foo2). XSD 1.0 Structures 4.2.4 clause 7.2 requires the redefined group's attribute uses to be a valid restriction of the original, with no inheritance. pyxsd accepts because check_redefine_restrictions skips a non-self attributeGroup reference, so the expected-invalid schema is a false accept."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("redefine-attribute-group-merge").
[[dispositions]]
id = "xsts-redefine-attribute-group-merge"
title = "A self-referential redefined attribute group can introduce duplicate attribute uses"
category = "implementation-gap"
profiles = ["xsd10", "xsd11"]
cases = ["MS-AttributeGroup2006-07-15/attgD017/attgD017"]
links = [
  "https://www.w3.org/TR/xmlschema-1/#src-redefine",
  "https://www.w3.org/TR/xmlschema-1/#cAttribute_Group_Definitions",
]
rationale = "attgD017 redefines attg by keeping its self-reference and adding attributeGroup attg1 and attribute ref foo; the original attg also references foo, so the composed group has duplicate foo uses. XSD 1.0 Structures 3.6.2 clause 2 forbids two attribute uses with the same expanded name. check_redefine_restrictions skips when an attribute ref is present, so pyxsd accepts the expected-invalid schema."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("redefine-simple-type-enforcement").
[[dispositions]]
id = "xsts-redefine-simple-type-enforcement"
title = "A redefined simpleType's restriction is not enforced on instances"
category = "implementation-gap"
profiles = ["xsd10", "xsd11"]
cases = ["MS-SimpleType2006-07-15/stZ033/stZ033.i"]
links = ["https://www.w3.org/TR/xmlschema-1/#src-redefine"]
rationale = "stZ033 redefines simpleType B with enumeration 3, but the schema compiles and the instance value 2 validates. XSD 1.0 Structures 4.2.4 clause 5 requires the redefining simpleType to restrict the original, and the resulting B must carry the new enumeration. The redefined-type construction after rebind_redefine_references does not enforce it."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("redefine-default-attributes-apply").
[[dispositions]]
id = "xsts-redefine-default-attributes-apply"
title = "defaultAttributesApply on a redefined complexType does not reach the composed type"
category = "implementation-gap"
profiles = ["xsd11"]
cases = ["defaultAttributesApply/s3_4_2_4ii06/s3_4_2_4ii06i"]
links = [
  "https://www.w3.org/TR/xmlschema11-1/#dcl.ctd.attuses",
  "https://www.w3.org/TR/xmlschema11-1/#src-redefine",
]
rationale = "s3_4_2_4ii06 declares defaultAttributes tns:defaultAttrGroup and redefines c1 with defaultAttributesApply=false; the corpus, following bug 12129, expects the instance valid with dv:defaultAttr present. pyxsd rejects it as an unexpected, unparsed attribute, so the redefined type did not receive the effective default-attribute treatment. This is the XSD 1.1 default-attribute-group plus redefine seam, not the XSD 1.0 version deltas."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("circular-redefine-underspecified").
[[dispositions]]
id = "xsts-circular-redefine-underspecified"
title = "Circular redefine groups remain accepted where the corpus expects invalid instances"
category = "queried-corpus"
profiles = ["xsd10", "xsd11"]
cases = [
  "MS-Schema2006-07-15/schU4/schU4.i",
  "MS-Schema2006-07-15/schU5/schU5.i",
]
links = [
  "https://www.w3.org/TR/xmlschema-1/#src-redefine",
  "https://www.w3.org/Bugs/Public/show_bug.cgi?id=4136",
]
rationale = "schU4 and schU5 form circular include/import/redefine graphs. The corpus records their schema expectations as indeterminate and annotates the groups that the WG decided the spec is underspecified in this area, so implementations may reasonably differ (bug 4136, resolved fixed with that metadata). The dependent instances expect invalid, but the definitions those instances see depend on the underspecified cycle handling. pyxsd emits a compose-cycle advisory and accepts. The failures stay raw; this is a queried expectation, not a confirmed defect."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("override-composition").
[[dispositions]]
id = "xsts-override-composition"
title = "Circular and no-op xs:override documents are accepted"
category = "implementation-gap"
profiles = ["xsd11"]
cases = [
  "Override/over024/over024.bad.xsd",
  "Override/over026/over026.bad.xsd",
]
links = ["https://www.w3.org/TR/xmlschema11-1/#src-override"]
rationale = "over024 has two documents that override each other; over026 overrides nothing with zonedDate, so the override child is ignored and the remaining reference dangles. Both schemas are expected invalid under XSD 1.1 Structures 4.2.7, and pyxsd compiles both. The seam is splice_override and override pre-processing in schema_composition.py."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("identity-constraint-global-reference").
[[dispositions]]
id = "xsts-identity-constraint-global-reference"
title = "A keyref refer QName can resolve to a non-global identity constraint"
category = "implementation-gap"
profiles = ["xsd10", "xsd11"]
cases = ["MS-IdentityConstraint2006-07-15/idC019/idC019"]
links = ["https://www.w3.org/TR/xmlschema-1/#cIdentity-constraint_Definitions"]
rationale = "idC019.xsd declares a local xs:key named keyName inside root; the imported idC017a.xsd has keyref refer=keyName in diffNS. XSD 1.0 Structures 3.11.1 requires a keyref's referenced key to be an identity-constraint definition, a global key or unique component; the only keyName is local and not a valid target. The corpus records the unimported-QName decision as stable under bug 4057. pyxsd accepts because Keyref._checkRefer only checks that refer is non-empty."

