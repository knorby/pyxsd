# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("xsd10-attribute-group-circularity").
[[dispositions]]
id = "xsd10-attribute-group-circularity"
title = "XSD 1.0 forbids circular attributeGroup references outside redefine"
category = "version-switch-candidate"
profiles = ["xsd10"]
cases = [
  "MS-AttributeGroup2006-07-15/attgC010/attgC010",
  "MS-AttributeGroup2006-07-15/attgC020/attgC020",
  "MS-AttributeGroup2006-07-15/attgC031/attgC031",
  "MS-AttributeGroup2006-07-15/attgD015/attgD015",
]
