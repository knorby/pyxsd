# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("xsd10-multiple-id-attributes").
[[dispositions]]
id = "xsd10-multiple-id-attributes"
title = "XSD 1.0 must reject multiple ID-typed attributes and duplicate ID values"
category = "version-switch-candidate"
profiles = ["xsd10"]
cases = [
  "ElemDecl/idconstrdefs00301m/idConstrDefs00301m2_n",
  "MS-Attribute2006-07-15/attZ014a/attZ014a.i",
  "MS-Attribute2006-07-15/attZ014b/attZ014b.i",
  "MS-ComplexType2006-07-15/ctM004/ctM004",
  "MS-Element2006-07-15/elemZ016/elemZ016.i",
]
links = [
  "https://www.w3.org/TR/xmlschema-1/#ct-props-correct",
  "https://www.w3.org/TR/xmlschema-1/#cAttribute_Group_Definitions",
  "https://www.w3.org/TR/xmlschema11-1/#ct-props-correct",
  "https://www.w3.org/TR/xmlschema11-1/#sec-cvc-id",
]
rationale = "The corpus expects these schemas and instances invalid under XSD 1.0 and valid under XSD 1.1 (category xsd1_1-ID-IDREF-MultipleAttrsOfTypeID). XSD 1.0 Complex Type Definition Properties Correct clause 5 and Attribute Group Definition Properties Correct clause 3 forbid two distinct attribute uses both of type ID; XSD 1.1 removed both clauses and keeps only the same-expanded-name rule. XSD 1.1 Validation Root Valid (ID/IDREF) also permits multiple ID bindings that resolve to the same element. pyxsd's 1.0 mode accepts them."

