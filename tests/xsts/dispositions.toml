rationale = "The corpus expects these instances invalid under XSD 1.0 and valid under XSD 1.1 (category xsd1_1-Misc-LexicalRepForFloatAndDouble). XSD 1.1 added +INF to the float and double lexical spaces; XSD 1.0 accepts only INF, -INF and NaN for infinities. pyxsd's 1.0 mode accepts +INF, so the instances are false accepts at the datatype version gate."

