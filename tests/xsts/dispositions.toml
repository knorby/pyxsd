# Residual dispositions for checked-in XSTS failures.
#
# Contract (see tests/xsts/dispositions.py and the reporting design):
# - A disposition explains a failure; it never rewrites an outcome. The raw
#   checked denominator stays pass + fail and the headline agreement rate is
#   always 100 * pass / (pass + fail).
# - Validation reads only pyxsd: baseline keys, never xmlschema outcomes.
# - Case IDs are explicit; no pattern may silently classify a new failure.
#   Every failure not listed here stays visibly unclassified in the census.
# - Entries explain only current failures in generated reports. A case that
#   starts passing leaves the active report without an edit to this file.
# - `links` carries public specification/upstream URLs only; internal
#   adjudication paths appear as comments, never in emitted data.
# - Categories come from the closed vocabulary: implementation-gap,
#   version-switch-candidate, platform-limit, queried-corpus,
#   spec-correct-divergence, adapter-limit.

