  "https://www.w3.org/TR/xmlschema-1/#cAttribute_Group_Definitions",
  "https://www.w3.org/TR/xmlschema11-1/#cAttribute_Group_Definitions",
]
rationale = "The corpus expects these schemas invalid under XSD 1.0 and valid under XSD 1.1. XSD 1.0 Structures 3.6.3 clause 3 disallows direct and indirect circular attributeGroup references outside xs:redefine; XSD 1.1 explicitly allows them and takes the transitive closure. pyxsd's 1.0 mode accepts the circular groups, so the failures are 1.0 false accepts."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("xsd10-inline-schema-composition").
[[dispositions]]
id = "xsd10-inline-schema-composition"
title = "XSD 1.0 rejects a schema location or inline schema seen after an item from its target namespace"
category = "version-switch-candidate"
profiles = ["xsd10"]
cases = [
  "MS-Additional2006-07-15/addB156/addB156.i",
  "MS-Additional2006-07-15/addB158/addB158.i",
]
links = [
  "https://www.w3.org/TR/xmlschema-1/#src-include",
  "https://www.w3.org/TR/xmlschema11-1/#src-include",
]
rationale = "The corpus expects these instances invalid under XSD 1.0 and valid under XSD 1.1 (stable under bug 4078). The group documents an inline or schemaLocation schema encountered after an item from the schema's target namespace; the corpus records that ordering as an XSD 1.0 error removed in XSD 1.1. pyxsd's 1.0 mode accepts the instances. The reporting runner synthesizes a permissive schema for this group, and both cases are recorded as fail in the XSD 1.0 baseline."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("xsd10-valid-type-constructs").
[[dispositions]]
id = "xsd10-valid-type-constructs"
title = "XSD 1.0 mode rejects type constructs that XSD 1.0 accepts"
category = "version-switch-candidate"
profiles = ["xsd10"]
cases = [
  "MS-Particles2006-07-15/particlesZ031/particlesZ031",
  "MS-SimpleType2006-07-15/stE053/stE053",
  "MS-SimpleType2006-07-15/stZ007/stZ007",
  "MS-SimpleType2006-07-15/stZ047/stZ047",
  "MS-SimpleType2006-07-15/stZ055/stZ055",
]
links = [
  "https://www.w3.org/TR/xmlschema-1/#Simple_Type_Definitions",
  "https://www.w3.org/TR/xmlschema11-1/#Simple_Type_Definitions",
]
rationale = "These five schemas are expected valid under XSD 1.0 and invalid under XSD 1.1. pyxsd's 1.0 mode rejects them while its 1.1 mode accepts, so it applies a 1.1-only constraint in 1.0: a union member that is an xs:simpleType (stE053), a complexType renamed to anySimpleType and restricted (stZ007), anySimpleType as a substitution-group head (stZ047 and stZ055), and complexContent derived from simpleContent (particlesZ031). The corpus has no 1.1 category anchor for these; the expectations supply the direction."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("xsd10-conditional-inclusion").
[[dispositions]]
id = "xsd10-conditional-inclusion"
title = "XSD 1.0 profile does not evaluate vc: conditional inclusion"
category = "version-switch-candidate"
profiles = ["xsd10"]
cases = ["VC/vc024-11/vc024-11.xsd"]
links = ["https://www.w3.org/TR/xmlschema11-1/#cip"]
rationale = "The corpus expects this schema valid in both profiles because vc:facetAvailable=xs:assertion makes the xs:assert conditional and ignored by a processor without the xs:assertion facet (the annotation says the assertion is ignored under XSD 1.0). pyxsd does not evaluate vc: conditional inclusion, so its XSD 1.0 mode rejects the 1.1-only xs:assert while its XSD 1.1 mode accepts it. The corpus expectation is the intended conditional-inclusion behavior, so this is a version-gated implementation gap, not a corpus defect."

# Adjudication: docs/superpowers/ledgers/2026-11-01-xsts-remaining-semantic-clusters.md
# ("xsd10-unversioned-11-wildcard-vocabulary").
[[dispositions]]
id = "xsd10-unversioned-11-wildcard-vocabulary"
title = "XSD 1.0 profile rejects unversioned XSD 1.1-only wildcard vocabulary that the corpus expects valid"
category = "spec-correct-divergence"
profiles = ["xsd10"]
cases = [
  "anyAttribute/s3_10_6ii01/s3_10_6v01s",
  "anyAttribute/s3_10_6ii02/s3_10_6v02s",
  "anyAttribute/s3_10_6ii04/s3_10_6v04s",
  "wildcard/s3_10_1ii08/s3_10_1ii08s",
  "wildcard/s3_10_1ii09/s3_10_1ii09s",
]
links = [
  "https://www.w3.org/TR/xmlschema11-1/#Wildcard_details",
  "https://www.w3.org/TR/xmlschema11-1/#coss-wildcard",
]
rationale = "These five tests use XSD 1.1-only wildcard vocabulary: xs:anyAttribute notQName and notNamespace, and the definedSibling namespace keyword. They carry no XSD 1.1 version token, so the xsd10 profile selects the same valid expectation as xsd11. pyxsd's XSD 1.0 mode correctly rejects vocabulary that does not exist in XSD 1.0 and its 1.1 mode accepts. The divergence is in corpus applicability metadata, not in the 1.0 processor, so this is a spec-correct divergence rather than a version-switch implementation gap."

