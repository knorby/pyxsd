# pyxsd conformance corpus
#
# Each case is a self-contained schema (+ optional instance) pair exercising
# one claimed XSD 1.0 feature. The cases are independently authored regression
# tests for pyxsd; `derived_from` records the feature area / invalid-instance
# pattern that inspired the case (W3C XMLSchema1TestSuite or the NIST XML
# Schema Datatypes Test Suite), not a copied upstream case. Case expectations
# are enforced by tests/test_conformance.py and reported by
# tests/report_conformance.py.
#
# Case fields:
#   id              "area/name" (unique)
#   description     what the case covers
#   derived_from    W3C/NIST feature area that inspired the case
#   schema          the schema document (written as schema.xsd)
#   schema_valid    false => parseXSD must report errors (default: true)
#   instance        the instance document (written as instance.xml)
#   instance_valid  false => parsing the instance must report errors (default: true)
#   expected_codes  report codes that must appear in the failing step
#   expected_values dotted paths whose mapped values must equal the manifest
#   mode            binding policy: legacy (default), lax, namespaced, namespaced-lax
#   [case.files]    auxiliary schema files, keyed by name relative to schema.xsd

[provenance]
authorship = "Independently authored pyxsd regression cases"
inspiration = "W3C XMLSchema1TestSuite and NIST XML Schema Datatypes Test Suite feature areas"
note = "Not copied from the upstream suites; see per-case derived_from."

[[case]]
id = "types/scalars-valid"
description = "Core scalar built-ins: string, integer, decimal, double, date, boolean attribute"
derived_from = "NISTXMLSchemaDatatypesTestSuite (built-in types)"
schema = '''
<?xml version="1.0" encoding="UTF-8"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema">
  <xs:element name="scalars">
    <xs:complexType>
      <xs:sequence>
        <xs:element name="label" type="xs:string"/>
        <xs:element name="count" type="xs:integer"/>
        <xs:element name="ratio" type="xs:decimal"/>
        <xs:element name="measure" type="xs:double"/>
        <xs:element name="when" type="xs:date"/>
      </xs:sequence>
      <xs:attribute name="active" type="xs:boolean" use="required"/>
    </xs:complexType>
  </xs:element>
</xs:schema>
'''
instance = '''
<?xml version="1.0" encoding="UTF-8"?>
<scalars active="true">
  <label>Widget</label>
  <count>12</count>
  <ratio>19.95</ratio>
  <measure>1.5e3</measure>
  <when>2024-06-30</when>
</scalars>
'''

