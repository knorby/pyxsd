          <xs:element name="d" minOccurs="0" maxOccurs="1"/>
          <xs:element name="e" minOccurs="0" maxOccurs="4"/>
        </xs:all>
      </xs:extension>
    </xs:complexContent>
  </xs:complexType>
  <xs:element name="doc" type="derived"/>
</xs:schema>
'''
instance = '''
<?xml version="1.0" encoding="UTF-8"?>
<doc><b/>text<a/>text<d/>text<a/></doc>
'''
instance_valid = false
expected_codes = ["unexpected-character"]

