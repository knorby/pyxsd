              </xs:element>
            </xs:sequence>
          </xs:complexType>
        </xs:element>
      </xs:sequence>
    </xs:complexType>
    <xs:key name="itemKey">
      <xs:selector xpath="item"/>
      <xs:field xpath="@id"/>
    </xs:key>
    <xs:unique name="itemCode">
      <xs:selector xpath="item"/>
      <xs:field xpath="code"/>
    </xs:unique>
    <xs:keyref name="orderRef" refer="itemKey">
      <xs:selector xpath="order/line"/>
      <xs:field xpath="@ref"/>
    </xs:keyref>
  </xs:element>
</xs:schema>
'''
