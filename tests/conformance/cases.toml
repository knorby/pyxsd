      <xs:element name="y" type="xs:integer"/>
    </xs:sequence>
  </xs:group>
  <xs:group name="outer">
    <xs:sequence>
      <xs:element name="label" type="xs:string"/>
      <xs:group ref="inner"/>
    </xs:sequence>
  </xs:group>
  <xs:element name="plot">
    <xs:complexType>
      <xs:group ref="outer"/>
    </xs:complexType>
  </xs:element>
</xs:schema>
'''
instance = '''
<?xml version="1.0" encoding="UTF-8"?>
<plot>
  <label>origin</label>
  <x>0</x>
  <y>0</y>
</plot>
'''

[[case]]
id = "structure/group-circular"
description = "Mutually recursive group references are detected with code circular-group"
derived_from = "W3C XMLSchema1TestSuite, group 'group' (recursive definitions)"
schema = '''
<?xml version="1.0" encoding="UTF-8"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema">
  <xs:group name="a">
    <xs:sequence>
      <xs:group ref="b"/>
    </xs:sequence>
  </xs:group>
  <xs:group name="b">
    <xs:sequence>
      <xs:group ref="a"/>
    </xs:sequence>
  </xs:group>
  <xs:element name="root">
    <xs:complexType>
      <xs:group ref="a"/>
    </xs:complexType>
  </xs:element>
</xs:schema>
'''
schema_valid = false
expected_codes = ["circular-group"]

