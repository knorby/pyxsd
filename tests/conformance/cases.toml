[[case]]
id = "composition/chameleon-nested-include-valid"
description = "A chameleon include nested inside another chameleon inherits the outermost target namespace, so the absorbed group resolves (W3C schD10)"
derived_from = "W3C XMLSchema1TestSuite, group 'schD10' (chameleon include)"
mode = "namespaced"
schema = '''
<?xml version="1.0"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema"
           xmlns="urn:t" targetNamespace="urn:t" elementFormDefault="qualified">
  <xs:include schemaLocation="outer.xsd"/>
  <xs:complexType name="a-ct">
    <xs:sequence>
      <xs:group ref="c-g2"/>
    </xs:sequence>
  </xs:complexType>
  <xs:element name="root" type="a-ct"/>
</xs:schema>
'''
[case.files]
"outer.xsd" = '''
<?xml version="1.0"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema">
  <xs:include schemaLocation="inner.xsd"/>
  <xs:group name="grp">
    <xs:choice>
      <xs:group ref="c-g2"/>
    </xs:choice>
  </xs:group>
  <xs:complexType name="b-ct">
    <xs:group ref="c-g2"/>
  </xs:complexType>
</xs:schema>
'''
"inner.xsd" = '''
<?xml version="1.0"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema">
  <xs:group name="c-g2">
    <xs:sequence>
      <xs:element name="foo" type="xs:string"/>
    </xs:sequence>
  </xs:group>
</xs:schema>
'''

[[case]]
id = "composition/attribute-group-ref-same-local-name-valid"
description = "Two imported attributeGroups sharing a local name stay distinct by namespace, so both refs resolve (W3C attgB014)"
derived_from = "W3C XMLSchema1TestSuite, group 'attgB014' (imported attributeGroup refs)"
mode = "namespaced"
schema = '''
<?xml version="1.0"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema"
           xmlns:x="urn:foo" xmlns:y="urn:bar">
  <xs:import namespace="urn:foo" schemaLocation="foo.xsd"/>
  <xs:import namespace="urn:bar" schemaLocation="bar.xsd"/>
  <xs:element name="doc">
    <xs:complexType>
      <xs:attributeGroup ref="x:car"/>
      <xs:attributeGroup ref="y:car"/>
    </xs:complexType>
  </xs:element>
</xs:schema>
'''
[case.files]
"foo.xsd" = '''
<?xml version="1.0"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema"
           targetNamespace="urn:foo" attributeFormDefault="qualified">
  <xs:attributeGroup name="car">
    <xs:attribute name="model" type="xs:string"/>
  </xs:attributeGroup>
</xs:schema>
'''
"bar.xsd" = '''
<?xml version="1.0"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema"
           targetNamespace="urn:bar" attributeFormDefault="qualified">
  <xs:attributeGroup name="car">
    <xs:attribute name="age" type="xs:int"/>
  </xs:attributeGroup>
</xs:schema>
'''

[[case]]
id = "composition/conflicting-redefines-in-two-namespaces-invalid"
description = "Two imports redefine the same group from a chameleon base into different namespaces; the refs must not be resolved away, so the conflicting redefines stay rejected (W3C schN6)"
derived_from = "W3C XMLSchema1TestSuite, group 'schN6' (conflicting redefines across namespaces)"
mode = "namespaced"
schema = '''
<?xml version="1.0"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema"
           targetNamespace="urn:d" xmlns="urn:d">
  <xs:import namespace="urn:a" schemaLocation="a.xsd"/>
  <xs:import namespace="urn:b" schemaLocation="b.xsd"/>
</xs:schema>
'''
schema_valid = false
expected_codes = ["unknown-group"]
[case.files]
"a.xsd" = '''
<?xml version="1.0"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema"
           targetNamespace="urn:a" xmlns="urn:a" elementFormDefault="qualified">
  <xs:redefine schemaLocation="base.xsd">
    <xs:group name="c-g2">
      <xs:choice>
        <xs:element name="c21" type="xs:string" maxOccurs="2"/>
        <xs:element name="c22" type="xs:string" maxOccurs="2"/>
      </xs:choice>
    </xs:group>
  </xs:redefine>
  <xs:complexType name="a-ct">
    <xs:sequence>
      <xs:group ref="c-g2"/>
    </xs:sequence>
  </xs:complexType>
  <xs:element name="e1" type="a-ct"/>
</xs:schema>
'''
"b.xsd" = '''
<?xml version="1.0"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema"
           targetNamespace="urn:b" xmlns="urn:b" elementFormDefault="qualified">
  <xs:redefine schemaLocation="base.xsd">
    <xs:group name="c-g2">
      <xs:choice>
        <xs:group ref="c-g2"/>
        <xs:element name="c23" type="xs:int" maxOccurs="2"/>
        <xs:element name="c24" type="xs:string" maxOccurs="2"/>
      </xs:choice>
    </xs:group>
  </xs:redefine>
  <xs:complexType name="b-ct">
    <xs:group ref="c-g2"/>
  </xs:complexType>
  <xs:element name="e1" type="b-ct"/>
</xs:schema>
'''
"base.xsd" = '''
<?xml version="1.0"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema">
  <xs:group name="c-g2">
    <xs:choice>
      <xs:element name="c21" type="xs:int" maxOccurs="3"/>
      <xs:element name="c22" type="xs:int" maxOccurs="3"/>
    </xs:choice>
  </xs:group>
</xs:schema>
'''

