[[case]]
id = "types/string-derived-valid"
description = "String derivatives: NCName, Name, NMTOKEN, token, language, anyURI, QName, NMTOKENS list"
derived_from = "NISTXMLSchemaDatatypesTestSuite (string types)"
schema = '''
<?xml version="1.0" encoding="UTF-8"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema">
  <xs:element name="names">
    <xs:complexType>
      <xs:sequence>
        <xs:element name="handle" type="xs:NCName"/>
        <xs:element name="formal" type="xs:Name"/>
        <xs:element name="tag" type="xs:NMTOKEN"/>
        <xs:element name="note" type="xs:token"/>
        <xs:element name="locale" type="xs:language"/>
        <xs:element name="uri" type="xs:anyURI"/>
        <xs:element name="qual" type="xs:QName"/>
        <xs:element name="tags" type="xs:NMTOKENS"/>
      </xs:sequence>
    </xs:complexType>
  </xs:element>
</xs:schema>
'''
instance = '''
<?xml version="1.0" encoding="UTF-8"?>
<names xmlns:xs="http://www.w3.org/2001/XMLSchema">
  <handle>first_name</handle>
  <formal>my.name-2</formal>
  <tag>abc-123</tag>
  <note>trimmed text</note>
  <locale>en-US</locale>
  <uri>https://example.org/schema</uri>
  <qual>xs:string</qual>
  <tags>alpha beta gamma</tags>
</names>
'''
mode = "namespaced"

