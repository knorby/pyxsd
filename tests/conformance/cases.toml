[[case]]
id = "structure/group-ref-valid"
description = "xs:group reference flattened into a sequence plus attributeGroup reference"
derived_from = "W3C XMLSchema1TestSuite, groups 'group' and 'attributeGroup'"
schema = '''
<?xml version="1.0" encoding="UTF-8"?>
<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema">
  <xs:group name="coordinates">
    <xs:sequence>
      <xs:element name="x" type="xs:decimal"/>
      <xs:element name="y" type="xs:decimal"/>
    </xs:sequence>
  </xs:group>
  <xs:attributeGroup name="audit">
    <xs:attribute name="by" type="xs:string" use="required"/>
    <xs:attribute name="note" type="xs:string"/>
  </xs:attributeGroup>
  <xs:element name="point">
    <xs:complexType>
      <xs:sequence>
        <xs:element name="when" type="xs:date"/>
        <xs:group ref="coordinates"/>
      </xs:sequence>
      <xs:attributeGroup ref="audit"/>
    </xs:complexType>
  </xs:element>
</xs:schema>
'''
instance = '''
<?xml version="1.0" encoding="UTF-8"?>
<point by="kali">
  <when>2024-06-30</when>
  <x>1.0</x>
  <y>2.0</y>
</point>
'''

[[case]]
id = "structure/group-nested-valid"
description = "Group referencing another group flattens recursively"
derived_from = "W3C XMLSchema1TestSuite, group 'group' (nested references)"
schema = '''
