# pyxsd unsupported-features table
#
# Records XSD constructs pyxsd does not fully implement. Rendered into the
# conformance report and reproduced in the documentation. Status is one of:
# "unsupported", "partial", "ignored".

[[feature]]
name = "XML Namespaces"
construct = "targetNamespace, elementFormDefault/attributeFormDefault, prefixed QNames"
status = "partial"
note = "Namespace-aware validation is opt-in via ParseModes.NAMESPACED (CLI --namespaces strict): component identity, form-default-aware instance matching, xsi:type and type/ref QName resolution, cross-namespace imports, wildcard namespace/processContents, qualified identity-constraint selectors, and QName value-space identity are honored. Legacy mode (the default) keeps local-name matching for backward compatibility."

[[feature]]
name = "Wildcards with namespace filtering"
construct = "xs:any / xs:anyAttribute processContents, namespace lists"
status = "partial"
note = "In namespaced mode, namespace lists (##any, ##other, ##local, ##targetNamespace, explicit URIs) and processContents (strict, lax, skip) are enforced, including the wildcard-no-declaration error under strict. Legacy mode continues to pass undeclared content through permissively."

[[feature]]
name = "General XPath in identity constraints"
construct = "Expressions outside the XSD selector/field subset"
status = "unsupported"
note = "The XSD subset is supported. Predicates, absolute paths, additional axes, and function calls are reported and skipped."

[[feature]]
name = "Mixed complex content"
construct = "mixed=\"true\" complexTypes"
status = "partial"
note = "Character data is preserved verbatim in the bound tree: an element's leading text is kept in _value_ and the text following each child is recorded as that child's _tail_, and mixed elements serialize inline so ordered text round-trips. Declared children and occurrence limits are still validated. Structured exports are narrower: the dict export concatenates all recorded character data under \"$\", and the Arrow/Pydantic integration projections reject mixed content."

[[feature]]
name = "Schema hints by URL"
construct = "xsi:schemaLocation with remote/absolute URIs"
status = "partial"
note = "The default loader resolves local filesystem paths only and never fetches a URL. RemoteResourcePolicy adds opt-in HTTPS-only schema loading: a remote explicit or hint-selected main schema is the root read, allow_remote_hints gates instance-selected schemas, an additional remote hint from a local schema needs both allow_remote_hints and allow_local_remote, an ordinary local-schema remote dependency needs allow_local_remote, cross-origin dependencies of admitted remote documents need allowed_origins, and budgets are finite; there is no persistent cache."

[[feature]]
name = "Unique particle attribution"
construct = "UPA checking with XSD 1.1 wildcard exclusions"
status = "partial"
note = "Effective content models are checked, including inherited models and substitution groups. Wildcards carrying notQName or notNamespace exclusions are skipped."
