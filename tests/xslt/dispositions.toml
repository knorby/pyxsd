]
reason = "XSLT 3.0 section 12.4 makes the supported language set implementation-defined. pyxsd implements English word/ordinal numbering and falls back to it for German and Italian; the corpus grades these cases against that capability. Supporting the languages, or honoring the catalog's languages_for_numbering dependency in selection, is separate localization work."
