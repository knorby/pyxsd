]
reason = "These cases ask json-to-xml for schema-typed output. F&O 3.1 §17.5.3 specifies FOJS0004 when the processor does not support schema validation or typed data, and this profile deliberately does not implement the §C.2 json vocabulary as a schema or attach annotations. The function raises FOJS0004 for validate=true() instead of fabricating type annotations; validate=false() produces the untyped §17.4.2 tree."
