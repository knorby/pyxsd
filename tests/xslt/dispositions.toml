reason = "The a-suffixed as cases expect FODT0001 when the processor cannot represent the requested negative or high year. pyxsd accepts extended years, so the operation succeeds; the b/n/o alternatives in the same catalog express the passing behaviour. The two expectations are mutually exclusive capabilities, and this engine deliberately implements the extended-year side."
