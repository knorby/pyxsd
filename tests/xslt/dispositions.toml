[[dispositions]]
id = "deep-recursion-resource-limit"
title = "deeply recursive stylesheets reach the Python stack budget instead of a semantic verdict"
category = "platform-limit"
profiles = ["xslt30"]
cases = [
  "function/function-0701",
  "function/function-1031",
  "higher-order-functions/higher-order-functions-068",
  "seqtor/seqtor-032",
  "seqtor/seqtor-033",
]
reason = "These cases recurse through synchronous XPath expression evaluation and closure calls deeply enough to exceed CPython's per-interpreter recursion limit. The runtime reports the stable implementation resource code PYXSD-XSLT-001 instead of a raw RecursionError, so these rows are controlled resource failures rather than wrong results. Tail calls, simple arithmetic self-recursion, template dispatch, and literal content around a template call run on the heap scheduler; copying a result subtree uses an iterative explicit stack. The remaining recursion here stays inside synchronous comma sequences, short-circuit Boolean operands, count() over paths, and full-focus variable selects. A recorded follow-up pull request moves those expression shapes onto the heap scheduler."
links = ["https://www.w3.org/TR/xslt-30/#dynamic-errors", "https://docs.python.org/3/library/sys.html#sys.setrecursionlimit"]

[[dispositions]]
id = "deep-recursion-resource-limit-xslt20"
title = "the knight's-tour recursion reaches the Python stack budget in the 2.0 profile"
category = "platform-limit"
profiles = ["xslt20"]
cases = ["function/function-0701"]
reason = "function/function-0701 recurses through the knight's-tour stylesheet's synchronous variable select and xsl:sequence calls deeply enough to exceed CPython's per-interpreter recursion limit. Template application and literal content around a template call run on the heap scheduler, and copying a result subtree uses an iterative explicit stack; this recurrence keeps synchronous full-focus variable selects and predicates. The runtime reports PYXSD-XSLT-001, a controlled resource failure rather than a wrong result. A recorded follow-up pull request covers the remaining variable-select and focus seams."
links = ["https://www.w3.org/TR/xslt-30/#dynamic-errors", "https://docs.python.org/3/library/sys.html#sys.setrecursionlimit"]

# F&O 3.1 §17.5.3 defines FOJS0004 for validate=true() when the processor
# does not support schema validation or typed data. This profile implements the
# F&O 3.1 json-to-xml parsing contract but not the §C.2 schema vocabulary and
# its annotations, so the option is explicitly unavailable rather than
# fabricated. validate=false() and every other option are fully implemented.
