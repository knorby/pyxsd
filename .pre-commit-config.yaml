# pyxsd pre-commit configuration, adapted from knorby/repo-template.
# Reference: https://pre-commit.com/hooks.html
#
# Setup:
#   1. Install pre-commit:    pipx install pre-commit  (or: brew install pre-commit)
#   2. Install gitleaks:       brew install gitleaks
#   3. Install Go toolchain:   brew install go          (required for the trufflehog hook build)
#   4. Install hooks:          pre-commit install
#   5. Validate:               pre-commit run --all-files

default_language_version:
  python: python3

default_stages: [pre-commit]

repos:
  # --- General file checks ---
  # https://github.com/pre-commit/pre-commit-hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-added-large-files
        # The XSTS baselines are large, tracked data files (several MB) that
        # are refreshed deliberately as conformance work lands.
        exclude: ^tests/xsts/baseline-.*\.toml$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master, --branch, develop]

  # --- Python lint + format (replaces black; matches CI) ---
  # https://github.com/astral-sh/ruff-pre-commit
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
      - id: ruff-format

  # --- Secret scanning ---
  # https://github.com/gitleaks/gitleaks
  # Lightweight regex-based scanner using the system binary (brew install gitleaks).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  # https://github.com/trufflesecurity/trufflehog
  # Deeper scanner with API verification. Managed golang hook: pre-commit
  # builds the binary in an isolated GOPATH on first run (slow; cached after).
  # Requires the Go toolchain.
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.96.0
    hooks:
      - id: trufflehog
        # The Lob (mailing API) detector false-positives on snake_case test
        # identifiers (e.g. test_compile_returns_schema_with_classes) and its
        # verification endpoint confirms the garbage, failing every commit.
        # This repo has no Lob integration; exclude that one detector only.
        args: [--exclude-detectors=lob]

  # --- Shell scripts ---
  # https://github.com/shellcheck-py/shellcheck-py
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # --- Python hygiene ---
  # https://github.com/pre-commit/pygrep-hooks
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char
