# Pinned external sources for the showcase examples.
#
# Fields mirror examples/healthcare/sources.toml; two section kinds exist:
#   kind = "archive"  one zip, pinned by its SHA-256, extracted into destination/
#   kind = "files"    individual files, each pinned by SHA-256, placed at the given
#                    path under destination/ (paths mirror the origin URL layout)
# A section with localize = true additionally rewrites absolute schemaLocation
# URLs in the installed .xsd files to relative paths inside destination/.
# Downloaded content is never committed; see SOURCES.md for attribution.

