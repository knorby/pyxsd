name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Build distributions
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI OIDC trusted publishing.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        # Trusted publishing: no API token required once the PyPI project
        # is configured for this repository and the "pypi" environment.
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
