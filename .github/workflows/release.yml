name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  mcp:
    permissions:
      contents: read
    uses: ./.github/workflows/mcp.yml

  integrations:
    permissions:
      contents: read
    uses: ./.github/workflows/optional-integrations.yml

  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  build:
    needs: [core, mcp, integrations, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pyxsd/__init__.py)"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package version $PKG" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build distributions
        run: uv build

      - name: Check registry identity and wheel launcher
        run: |
          uv run --locked python scripts/check_mcp_registry.py
          uv run --locked --extra mcp pytest tests/mcp/test_installed_package.py -k registry -q
        env:
          PYXSD_DIST_DIR: dist

      - name: Test source archive and wheel contents
        run: >-
          uv run --locked --extra mcp pytest tests/test_distributions.py -q
        env:
          PYXSD_DIST_DIR: dist

      - name: Extract curated release notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{version}] - "
          matching = [section for section in changelog.split("\n## ") if section.startswith(f"[{version}] - ")]
          if len(matching) != 1:
              raise SystemExit(f"Expected one dated changelog section: {heading}")
          notes = matching[0].split("\n", 1)[1].strip()
          if not notes:
              raise SystemExit("Release notes must not be empty")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      # Required for PyPI OIDC trusted publishing.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        # Trusted publishing: no API token required once the PyPI project
        # is configured for this repository and the "pypi" environment.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check published PyPI metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl --fail --location --silent --show-error --max-time 20 \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "https://pypi.org/pypi/pyxsd/${VERSION}/json" --output pypi.json
          uv run --locked python scripts/check_mcp_registry.py --pypi pypi.json

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify registry publisher
        run: |
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --max-time 60 --output "$ARCHIVE" "$BASE/$ARCHIVE"
          curl --fail --location --silent --show-error --max-time 60 --output "$ARCHIVE.sigstore.json" "$BASE/$ARCHIVE.sigstore.json"
          cosign verify-blob \
            --bundle "$ARCHIVE.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$ARCHIVE"
          tar xzf "$ARCHIVE" mcp-publisher

      - name: Validate registry manifest
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish registry metadata
        run: ./mcp-publisher publish

      - name: Verify published registry record
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl --fail --location --silent --show-error --max-time 20 \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.knorby%2Fpyxsd/versions/${VERSION}" --output registry.json
          uv run --locked python scripts/check_mcp_registry.py --registry registry.json

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
