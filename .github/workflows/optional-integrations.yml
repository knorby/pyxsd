name: Optional integrations

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: optional-integrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        dependencies: [minimum, current]
    env:
      PYTHON_VERSION: ${{ matrix.python }}
      DEPENDENCIES: ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel and create clean environment
        run: |
          uv build --wheel
          uv venv --python "$PYTHON_VERSION"
      - name: Install both extras at minimum or current versions
        run: |
          WHEEL=$(find dist -name '*.whl' -print -quit)
          if [ "$DEPENDENCIES" = minimum ]; then
            uv pip install "$WHEEL[pydantic,arrow]" 'pydantic==2.12.5' 'pyarrow==22.0.0' 'pytest>=8.4' 'pytest-cov>=7'
            .venv/bin/python -c 'import importlib.metadata as m; assert (m.version("pydantic"), m.version("pyarrow")) == ("2.12.5", "22.0.0")'
          else
            uv pip install "$WHEEL[pydantic,arrow]" 'pytest>=8.4' 'pytest-cov>=7'
          fi
      - name: Test installed adapters and separate branch coverage
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_integration_projection.py tests/test_pydantic_integration.py
          tests/test_arrow_integration.py tests/test_integration_imports.py
          tests/test_integration_review.py
          tests/test_optional_examples.py
          --cov=pyxsd.integrations --cov-config=tests/integration.coveragerc
          --cov-report=term-missing
      - name: Run installed-package example
        run: .venv/bin/python examples/optional_integrations.py example.parquet

  independent-installs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        extras: ["", pydantic, arrow, "pydantic,arrow"]
    env:
      EXTRAS: ${{ matrix.extras }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install wheel into a clean independent environment
        run: |
          uv build --wheel
          uv venv --python 3.12
          WHEEL=$(find dist -name '*.whl' -print -quit)
          if [ -n "$EXTRAS" ]; then
            WHEEL="$WHEEL[$EXTRAS]"
          fi
          uv pip install "$WHEEL" 'pytest>=8.4'
      - name: Verify base and independently installed extras
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_integration_imports.py tests/test_integration_projection.py
          tests/test_pydantic_integration.py tests/test_arrow_integration.py
          tests/test_integration_review.py
          tests/test_optional_examples.py
