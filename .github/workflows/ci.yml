name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Ruff lint
        run: uvx ruff@0.16.6 check .

      - name: Ruff format check
        run: uvx ruff@0.16.6 format --check .

  test:
    runs-on: ubuntu-latest
    # 20 min: the XSD Test Suite step adds several minutes on top of the
    # coverage run (~3 min); slower runners need headroom beyond 15.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve the pinned xsdtests corpus commit
        id: corpus
        run: echo "sha=$(git rev-parse HEAD:tests/xsts/corpus)" >> "$GITHUB_OUTPUT"

      - name: Cache the xsdtests corpus submodule
        uses: actions/cache@v6
        with:
          path: |
            tests/xsts/corpus
            .git/modules/tests/xsts/corpus
          key: xsdtests-${{ runner.os }}-${{ steps.corpus.outputs.sha }}

      - name: Check out the xsdtests corpus
        run: git submodule update --init --depth 1 tests/xsts/corpus

      - name: Cache downloaded example schemas
        id: schemas
        uses: actions/cache@v6
        with:
          path: |
            examples/musicxml/schemas
            examples/gpx/schemas
            examples/docx/schemas
          key: example-schemas-${{ runner.os }}-${{ hashFiles('examples/*/download_schemas.py') }}

      - name: Sync environment
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Download example schemas
        if: steps.schemas.outputs.cache-hit != 'true'
        run: |
          uv run python examples/musicxml/download_schemas.py
          uv run python examples/gpx/download_schemas.py
          uv run python examples/docx/download_schemas.py

      - name: Cache the conformance corpus
        id: conformance
        uses: actions/cache@v6
        with:
          path: tests/conformance/.cache
          key: conformance-schemas-${{ runner.os }}-${{ hashFiles('tests/conformance/fetch.py') }}

      - name: Fetch the conformance corpus
        if: steps.conformance.outputs.cache-hit != 'true'
        run: uv run python -m tests.conformance.fetch

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-branch --cov-report=xml --cov-report=term-missing --ignore=tests/mcp

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
          include-hidden-files: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}

      - name: Run the XSD Test Suite
        run: uv run pytest tests/test_xsts_suite.py -q
        env:
          PYXSD_RUN_XSTS: "1"
          # Standard runners are 2-4x slower than a dev machine; the
          # slowest instance cases need more than the 60 s dev default.
          # 180 s also covers the regex cases the repeated-particle fast
          # path settled into a 24-43 s band on a dev machine.
          PYXSD_XSTS_TIMEOUT: "180"

      - name: Benchmark the conformance corpus
        if: github.event_name == 'pull_request'
        run: uv run python -m tests.conformance.run --json > conformance-benchmarks.json

      - name: Upload conformance benchmarks artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: conformance-benchmarks-${{ matrix.python-version }}
          path: conformance-benchmarks.json

      - name: Smoke-test installed base-only batch API
        run: |
          uv build --wheel
          uv venv --python ${{ matrix.python-version }} "$RUNNER_TEMP/pyxsd-batch"
          WHEEL=$(find dist -name '*.whl' -print -quit)
          uv pip install --python "$RUNNER_TEMP/pyxsd-batch/bin/python" "$WHEEL" 'pytest>=8.4'
          "$RUNNER_TEMP/pyxsd-batch/bin/python" -m pytest -q tests/test_batch_parse.py tests/test_batch_example.py

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Sync environment
        run: uv sync --group dev --python 3.12

      - name: mypy
        run: uv run mypy src/pyxsd --exclude 'src/pyxsd/mcp/'

  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Sync environment
        run: uv sync --group dev --python 3.12

      - name: Compare against the xmlschema oracle
        # This job runs one test module, so the whole-suite floor does not
        # apply; the report is uploaded to Codecov and merged with the
        # coverage job's report instead.
        run: >-
          uv run pytest tests/test_oracle.py -q
          --cov --cov-branch --cov-report=xml --cov-report=term-missing
          --cov-fail-under=0
        env:
          PYXSD_RUN_ORACLE: "1"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: oracle
