name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Ruff lint
        run: uvx ruff@0.16.6 check .

      - name: Ruff format check
        run: uvx ruff@0.16.6 format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve the pinned xsdtests corpus commit
        id: corpus
        run: echo "sha=$(git rev-parse HEAD:tests/xsts/corpus)" >> "$GITHUB_OUTPUT"

      - name: Cache the xsdtests corpus submodule
        uses: actions/cache@v6
        with:
          path: |
            tests/xsts/corpus
            .git/modules/tests/xsts/corpus
          key: xsdtests-${{ runner.os }}-${{ steps.corpus.outputs.sha }}

      - name: Check out the xsdtests corpus
        run: git submodule update --init --depth 1 tests/xsts/corpus

      - name: Cache downloaded example schemas
        id: schemas
        uses: actions/cache@v6
        with:
          path: |
            examples/musicxml/schemas
            examples/gpx/schemas
            examples/docx/schemas
          key: example-schemas-${{ runner.os }}-${{ hashFiles('examples/*/download_schemas.py') }}

      - name: Sync environment
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Download example schemas
        if: steps.schemas.outputs.cache-hit != 'true'
        run: |
          uv run python examples/musicxml/download_schemas.py
          uv run python examples/gpx/download_schemas.py
          uv run python examples/docx/download_schemas.py

      - name: Run tests with coverage
        run: uv run pytest --cov=pyxsd --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage
          include-hidden-files: true

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Sync environment
        run: uv sync --group dev --python 3.12

      - name: mypy
        run: uv run mypy src/pyxsd

  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Sync environment
        run: uv sync --group dev --python 3.12

      - name: Compare against the xmlschema oracle
        run: uv run pytest tests/test_oracle.py -q
        env:
          PYXSD_RUN_ORACLE: "1"
