name: Docs

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Resolve the pinned xsdtests corpus commit
        id: corpus
        run: >
          echo "sha=$(git rev-parse HEAD:tests/xsts/corpus)" >> "$GITHUB_OUTPUT"

      - name: Cache the xsdtests corpus submodule
        uses: actions/cache@v6
        with:
          path: |
            tests/xsts/corpus
            .git/modules/tests/xsts/corpus
          key: xsdtests-${{ runner.os }}-${{ steps.corpus.outputs.sha }}

      - name: Check out the xsdtests corpus
        run: git submodule update --init --depth 1 tests/xsts/corpus

      - name: Sync environment
        run: uv sync --group docs

      # Freshness gate: the generated XSTS fragments must match the
      # checked-in baselines, the pinned corpus, and dispositions.toml.
      # Runs before Sphinx so a stale table fails the build directly.
      - name: Check generated XSTS documentation
        run: uv run python tests/report_xsts_docs.py --check

      - name: Build documentation
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Setup Pages
        if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
